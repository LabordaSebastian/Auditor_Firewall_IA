ASA Version 9.8(4)
!
hostname ASA-PERIMETRAL-CORP
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 181.30.22.100 255.255.255.240
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 192.168.100.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 172.16.50.1 255.255.255.0
!
object network OBJ_SRV_DB
 host 172.16.50.10
!
object network OBJ_SRV_WEB
 host 172.16.50.80
!
object-group network GRP_ADMIN_IPS
 network-object 192.168.100.50 255.255.255.255
 network-object 192.168.100.51 255.255.255.255
!
object-group service GRP_WEB_PORTS tcp
 port-object eq www
 port-object eq https
!
! ACL outside (inbound)
access-list ACL_OUTSIDE_IN extended permit tcp any object OBJ_SRV_WEB object-group GRP_WEB_PORTS
! 1. Shadowing: regla permisiva anula la siguiente
access-list ACL_OUTSIDE_IN extended permit ip any 172.16.50.0 255.255.255.0
access-list ACL_OUTSIDE_IN extended deny tcp any host 172.16.50.10 eq 3306
! 2. Exposición de SSH WAN sin restricción
access-list ACL_OUTSIDE_IN extended permit tcp any host 181.30.22.100 eq 22
! 3. Regla temporal olvidada
access-list ACL_OUTSIDE_IN extended permit tcp host 201.21.33.4 host 172.16.50.99 eq 8080
!
access-group ACL_OUTSIDE_IN in interface outside
!
! ACL Huérfana en ASA
access-list ACL_TEST_ORPHAN extended permit ip any any
!
! Gestión de administración ASA expuesta a cualquier red
http server enable
http 0.0.0.0 0.0.0.0 outside
ssh 0.0.0.0 0.0.0.0 outside
!
snmp-server community CorpAsaCommunity2025
!
: end
