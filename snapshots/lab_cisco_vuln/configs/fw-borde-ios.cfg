!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-BORDE-CORP
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rJ7wL9pU3kL2m1o4q.
enable password Cisc0PasswordInsegura
!
no aaa new-model
!
ip domain name corporativo.local
!
! Configuración de interfaces
interface GigabitEthernet0/0
 description WAN-INTERNET-FIBRA-PRIMARIA
 ip address 200.45.112.18 255.255.255.248
 ip access-group ACL_WAN_IN in
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LAN-INTERNA-USUARIOS
 ip address 192.168.1.1 255.255.255.0
 ip access-group ACL_LAN_IN in
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ-SERVIDORES-WEB
 ip address 172.16.10.1 255.255.255.0
 duplex auto
 speed auto
!
! ACL de entrada desde Internet (Vulnerabilidades inyectadas)
ip access-list extended ACL_WAN_IN
 ! 1. Critical Shadowing: regla permisiva anula el bloqueo a la DMZ
 10 permit tcp any 172.16.10.0 0.0.0.255 eq 443
 20 deny tcp any host 172.16.10.50 eq 443
 ! 2. Exposición directa de Telnet a la IP pública del router
 30 permit tcp any host 200.45.112.18 eq 23
 ! 3. Regla temporal vencida sin retirar
 40 remark Regla temporal soporte externo ticket INC-2023-8821 expiro en diciembre 2023
 50 permit tcp host 190.11.22.33 host 172.16.10.20 eq 3389
 ! 4. Regla redundante idéntica
 60 permit tcp host 198.51.100.5 host 172.16.10.80 eq 80
 70 permit tcp host 198.51.100.5 host 172.16.10.80 eq 80
 ! 5. Falta de 'deny ip any any log' explícito (cae en implicit deny silencioso)
!
! ACL interna con excesiva permisividad
ip access-list extended ACL_LAN_IN
 10 remark Acceso general de usuarios
 20 permit ip any any
!
! ACL Huérfana (declarada pero jamás aplicada a una interfaz)
ip access-list extended ACL_LEGACY_MIGRACION_2022
 10 permit tcp 10.0.0.0 0.255.255.255 any eq 8080
 20 deny ip any any
!
! Gestión SNMP insegura
snmp-server community CorpRoSecret2025 RO
snmp-server location DataCenter-Piso2
!
! Vulnerabilidad en plano de gestión (VTY sin access-class y con Telnet)
line con 0
 stopbits 1
line vty 0 4
 transport input telnet ssh
 login local
line vty 5 15
 transport input telnet
 login local
!
end
